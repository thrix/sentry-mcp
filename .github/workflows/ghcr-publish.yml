name: Publish container to ghcr.io

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  container:
    runs-on: ubuntu-latest
    if: >-
      !(github.event_name == 'pull_request' && github.event.action == 'closed')
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine push strategy
        id: push
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ steps.push.outputs.enabled }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image with cosign
        if: github.event_name != 'pull_request' && steps.push.outputs.enabled == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes ${{ env.IMAGE }}@${DIGEST}

  # Clean up PR images after merge/close to avoid storage bloat
  cleanup-pr-images:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    permissions:
      packages: write
    env:
      PR_TAG: pr-${{ github.event.number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Delete PR container image
        run: |
          PACKAGE="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          PR_TAG="${{ env.PR_TAG }}"
          # Try org endpoint first, fall back to user endpoint
          for ENDPOINT in "/orgs/${OWNER}" "/users/${OWNER}"; do
            VERSION_ID=$(gh api \
              "${ENDPOINT}/packages/container/${PACKAGE}/versions" \
              --jq ".[] | select(.metadata.container.tags[] == \"${PR_TAG}\") | .id" 2>/dev/null) && break
          done
          if [ -n "$VERSION_ID" ]; then
            gh api --method DELETE \
              "${ENDPOINT}/packages/container/${PACKAGE}/versions/${VERSION_ID}"
            echo "Deleted image tagged ${PR_TAG} (version ${VERSION_ID})"
          else
            echo "No image found with tag ${PR_TAG}, skipping"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
